<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" fill="none">
  <defs>
    <linearGradient id="evGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C66A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="evBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0E1A3F" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0E1A3F" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Emblem Icon: Hexagon Shield with E & V -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield Hexagon -->
    <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="url(#evBlue)" stroke="url(#evGold)" stroke-width="3" filter="url(#subtleGlow)"/>
    
    <!-- Stylized "E" and "V" intersection -->
    <!-- E left vertical & bars -->
    <path d="M 28 32 L 68 32 L 68 40 L 40 40 L 40 48 L 62 48 L 62 56 L 40 56 L 40 68 L 28 68 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Dynamic Gold V Chevron passing through -->
    <path d="M 46 44 L 62 76 L 78 44 L 70 44 L 62 62 L 54 44 Z" fill="url(#evGold)"/>

    <!-- Small Sparkle / Star accent -->
    <circle cx="72" cy="24" r="3" fill="url(#evGold)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 48)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#0E1A3F" letter-spacing="1.5">
      EHTHESHAM
    </text>
    <text x="0" y="26" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A" letter-spacing="4">
      VENTURES <tspan fill="#D97706" font-weight="800">LLC</tspan>
    </text>
    <text x="0" y="46" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="2">
      WHOLESALE PRODUCT SOURCING
    </text>
  </g>
</svg>
